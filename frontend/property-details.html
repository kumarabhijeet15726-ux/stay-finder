<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — StayFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      padding: 2rem 0 4rem;
      align-items: start;
    }

    /* IMAGE GALLERY */
    .gallery {
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--gray-100);
    }

    .gallery__main {
      height: 420px;
      position: relative;
      background: var(--gray-100);
      overflow: hidden;
    }

    .gallery__main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery__thumbs {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      background: white;
      border-top: 1px solid var(--gray-200);
      overflow-x: auto;
    }

    .gallery__thumb {
      width: 80px;
      height: 60px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
      transition: var(--transition);
    }

    .gallery__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery__thumb.active { border-color: var(--primary); }

    /* DETAIL SECTIONS */
    .detail-section {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-top: 1.5rem;
    }

    .detail-section h3 {
      font-size: 1.1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--gray-100);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .info-item {}
    .info-item__label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
    }
    .info-item__value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--secondary);
    }

    /* AMENITIES */
    .amenity-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .amenity-tag {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    /* STICKY SIDEBAR */
    .contact-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: 90px;
    }

    .contact-card__price-header {
      background: var(--secondary);
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    .contact-card__price {
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
    }

    .contact-card__price-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.25rem;
    }

    .contact-card__deposit {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      margin-top: 0.5rem;
    }

    .contact-card__body {
      padding: 1.5rem;
    }

    .contact-card__info {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .contact-card__info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
    }

    .contact-card__info-row span:first-child { color: var(--gray-500); }
    .contact-card__info-row span:last-child { font-weight: 600; color: var(--secondary); }

    .enquiry-form .form-group { margin-bottom: 1rem; }

    .breadcrumb {
      padding: 1rem 0;
      font-size: 0.85rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb a { color: var(--primary); }

    @media (max-width: 768px) {
      .detail-layout { grid-template-columns: 1fr; }
      .contact-card { position: relative; top: 0; }
      .gallery__main { height: 260px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          </svg>
        </div>
        Stay<span>Finder</span>
      </a>
      <ul class="navbar__links" id="navbar-links">
        <li><a href="index.html" class="navbar__link">Home</a></li>
        <li><a href="explore.html" class="navbar__link active">Explore</a></li>
      </ul>
      <div class="navbar__actions" id="navbar-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
      <button class="navbar__toggle" id="navbar-toggle"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a> /
    <a href="explore.html">Explore</a> /
    <span id="breadcrumb-name">Property Details</span>
  </div>

  <div id="page-content">
    <div class="loading-state" style="padding: 6rem 0;">
      <div class="spinner"></div>
      <span>Loading property details...</span>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  let property = null;
  let currentImageIndex = 0;

  async function loadProperty() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('page-content').innerHTML = `
        <div class="empty-state" style="padding:4rem 0;">
          <h3>Property not found</h3>
          <p>No property ID provided.</p>
          <a href="explore.html" class="btn btn-primary">Browse Properties</a>
        </div>`;
      return;
    }

    try {
      const data = await propertyAPI.getOne(id);
      property = data.property;
      document.getElementById('breadcrumb-name').textContent = property.name;
      renderProperty();
    } catch (error) {
      document.getElementById('page-content').innerHTML = `
        <div class="empty-state" style="padding:4rem 0;">
          <h3>Property Not Found</h3>
          <p>${error.message}</p>
          <a href="explore.html" class="btn btn-primary">Browse Properties</a>
        </div>`;
    }
  }

  function renderProperty() {
    const hasImages = property.images && property.images.length > 0;
    const mainImg = hasImages
      ? `<img src="${getImageUrl(property.images[0])}" alt="${property.name}" id="main-image">`
      : `<div class="img-placeholder" style="height:100%;">
           <svg width="60" height="60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
           <span>No Images Available</span>
         </div>`;

    const thumbs = hasImages
      ? property.images.map((img, i) =>
          `<div class="gallery__thumb ${i===0?'active':''}" onclick="switchImage(${i})">
             <img src="${getImageUrl(img)}" alt="Photo ${i+1}">
           </div>`
        ).join('')
      : '';

    const amenityIcons = { 'WiFi': '📶', 'AC': '❄️', 'Gym': '🏋️', 'Laundry': '👕', 'Parking': '🅿️', 'CCTV': '📹', 'Power Backup': '⚡', 'RO Water': '💧', 'Housekeeping': '🧹', 'Common Kitchen': '🍳' };

    const amenitiesHTML = property.amenities && property.amenities.length > 0
      ? property.amenities.map(a => `<span class="amenity-tag">${amenityIcons[a] || '✓'} ${a}</span>`).join('')
      : '<span class="text-muted text-sm">No amenities listed</span>';

    const user = getCurrentUser();
    const isStudent = user && user.role === 'student';

    document.getElementById('page-content').innerHTML = `
      <div class="detail-layout">
        <!-- LEFT COLUMN -->
        <div>
          <!-- Gallery -->
          <div class="gallery">
            <div class="gallery__main">${mainImg}</div>
            ${hasImages && property.images.length > 1 ? `<div class="gallery__thumbs">${thumbs}</div>` : ''}
          </div>

          <!-- Property Info -->
          <div class="detail-section">
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1rem;">
              <div>
                <div style="font-size:0.75rem; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem;">${property.type}</div>
                <h2 style="font-size:1.6rem; margin-bottom:0.5rem;">${property.name}</h2>
                <div style="display:flex; align-items:center; gap:0.5rem; color:var(--gray-500); font-size:0.9rem;">
                  <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  ${property.address}
                </div>
                ${property.nearbyCollege ? `<div style="margin-top:0.4rem; font-size:0.85rem; color:var(--primary); font-weight:500;">🎓 Near: ${property.nearbyCollege}</div>` : ''}
              </div>
              <div style="display:flex; gap:0.5rem; flex-shrink:0;">
                <span class="badge badge-${property.genderPreference === 'Girls' ? 'primary' : property.genderPreference === 'Boys' ? 'primary' : 'approved'}">${property.genderPreference}</span>
              </div>
            </div>
            <p style="color:var(--gray-600); line-height:1.8;">${property.description}</p>
          </div>

          <!-- Key Details -->
          <div class="detail-section">
            <h3>🏠 Room Details</h3>
            <div class="info-grid">
              <div class="info-item">
                <div class="info-item__label">Sharing Type</div>
                <div class="info-item__value">${property.sharingType} Sharing</div>
              </div>
              <div class="info-item">
                <div class="info-item__label">Gender Preference</div>
                <div class="info-item__value">${property.genderPreference}</div>
              </div>
              <div class="info-item">
                <div class="info-item__label">Air Conditioning</div>
                <div class="info-item__value">${property.hasAC ? '✅ Available' : '❌ Not Available'}</div>
              </div>
              <div class="info-item">
                <div class="info-item__label">Food</div>
                <div class="info-item__value">${property.hasFood ? '✅ Included' : '❌ Not Included'}</div>
              </div>
              <div class="info-item">
                <div class="info-item__label">City</div>
                <div class="info-item__value">${property.city}</div>
              </div>
              <div class="info-item">
                <div class="info-item__label">Locality</div>
                <div class="info-item__value">${property.locality}</div>
              </div>
            </div>
          </div>

          <!-- Amenities -->
          <div class="detail-section">
            <h3>✨ Amenities</h3>
            <div class="amenity-tags">${amenitiesHTML}</div>
          </div>

          <!-- House Rules -->
          ${property.houseRules ? `
          <div class="detail-section">
            <h3>📋 House Rules</h3>
            <p style="color:var(--gray-600); line-height:1.8;">${property.houseRules}</p>
          </div>` : ''}
        </div>

        <!-- RIGHT COLUMN (Sticky Contact Card) -->
        <div>
          <div class="contact-card">
            <div class="contact-card__price-header">
              <div class="contact-card__price">₹${property.monthlyRent.toLocaleString()}</div>
              <div class="contact-card__price-label">per month</div>
              <div class="contact-card__deposit">Security Deposit: ₹${property.securityDeposit.toLocaleString()}</div>
            </div>

            <div class="contact-card__body">
              <div class="contact-card__info">
                <div class="contact-card__info-row">
                  <span>Availability</span>
                  <span style="color: ${property.isAvailable ? 'var(--success)' : 'var(--danger)'}">
                    ${property.isAvailable ? '✅ Available' : '❌ Not Available'}
                  </span>
                </div>
                <div class="contact-card__info-row">
                  <span>Contact</span>
                  <span>📞 ${property.contactNumber}</span>
                </div>
                <div class="contact-card__info-row">
                  <span>Owner</span>
                  <span>${property.owner?.name || 'N/A'}</span>
                </div>
              </div>

              ${property.isAvailable ? `
              <div id="enquiry-section">
                ${isStudent ? `
                <!-- ENQUIRY FORM -->
                <div style="border-top: 1px solid var(--gray-100); padding-top: 1.25rem;">
                  <h4 style="margin-bottom:1rem; font-size:0.95rem;">📩 Send Enquiry</h4>
                  <div id="enquiry-alert"></div>
                  <div class="enquiry-form">
                    <div class="form-group">
                      <input type="text" class="form-input" id="enq-name" placeholder="Your Name" value="${user.name}">
                    </div>
                    <div class="form-group">
                      <input type="email" class="form-input" id="enq-email" placeholder="Your Email" value="${user.email}">
                    </div>
                    <div class="form-group">
                      <input type="tel" class="form-input" id="enq-phone" placeholder="Your Phone" value="${user.phone || ''}">
                    </div>
                    <div class="form-group">
                      <textarea class="form-textarea" id="enq-message" rows="3" placeholder="Hi! I'm interested in this property. When can I visit?"></textarea>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="submitEnquiry()">Send Enquiry</button>
                  </div>
                </div>` : `
                <div class="alert alert-info">
                  <span>Please <a href="login.html" style="font-weight:700; color: var(--primary);">log in as a student</a> to send an enquiry.</span>
                </div>`}
              </div>` : `
              <div class="alert alert-warning">This property is currently not accepting enquiries.</div>`}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function switchImage(index) {
    currentImageIndex = index;
    const mainImg = document.getElementById('main-image');
    if (mainImg && property.images[index]) {
      mainImg.src = `http://localhost:5000${property.images[index]}`;
    }
    document.querySelectorAll('.gallery__thumb').forEach((t, i) => {
      t.classList.toggle('active', i === index);
    });
  }

  async function submitEnquiry() {
    const name = document.getElementById('enq-name')?.value.trim();
    const email = document.getElementById('enq-email')?.value.trim();
    const phone = document.getElementById('enq-phone')?.value.trim();
    const message = document.getElementById('enq-message')?.value.trim();
    const alertEl = document.getElementById('enquiry-alert');

    if (!name || !email || !phone || !message) {
      alertEl.innerHTML = `<div class="alert alert-error" style="margin-bottom:1rem;">Please fill in all fields.</div>`;
      return;
    }

    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      await enquiryAPI.submit({ propertyId: property._id, name, email, phone, message });
      alertEl.innerHTML = `<div class="alert alert-success" style="margin-bottom:1rem;">✅ Enquiry sent! The owner will contact you soon.</div>`;
      btn.textContent = 'Enquiry Sent!';
    } catch (error) {
      alertEl.innerHTML = `<div class="alert alert-error" style="margin-bottom:1rem;">${error.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Send Enquiry';
    }
  }

  loadProperty();
</script>
</body>
</html>
